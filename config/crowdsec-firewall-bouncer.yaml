# CrowdSec Firewall Bouncer Configuration (nftables)
# Mount your own config over this file to override.

api_url: http://127.0.0.1:8080
api_key: REPLACE_WITH_YOUR_API_KEY
mode: nftables
update_frequency: 10s
daemonize: false

log_level: info
log_media: stdout
log_dir: /var/log
pid_dir: /var/run

nftables:
  enabled: true
  ipv4_table: crowdsec
  ipv6_table: crowdsec6
  ipv4_chain: crowdsec-chain
  ipv6_chain: crowdsec-chain
