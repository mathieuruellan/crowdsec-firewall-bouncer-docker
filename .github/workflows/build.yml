name: Build and Push

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  create:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'create' || github.event.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6

      - name: Extract bouncer version from Dockerfile
        run: |
          BOUNCER_VERSION=$(grep -oP 'releases/download/v\K[0-9.]+' Dockerfile | head -1)
          if [ -z "${BOUNCER_VERSION}" ]; then
            echo "Could not extract bouncer version from Dockerfile"
            exit 1
          fi
          echo "BOUNCER_VERSION=${BOUNCER_VERSION}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-bouncer-${{ env.BOUNCER_VERSION }}
            type=ref,event=tag,suffix=-bouncer-${{ env.BOUNCER_VERSION }}
            type=raw,value=latest,suffix=-bouncer-${{ env.BOUNCER_VERSION }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
